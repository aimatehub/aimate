<style>
:root{--bg:#f6f5ff;--card:#fff;--tx:#17142b;--mu:#645f80;--bd:#e3e0f5;--p:#6d4aff;--p2:#ff5c8a;--p3:#12b9a6;--sh:0 8px 28px rgba(80,60,200,.12)}

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3,.logo{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em;margin:0}
a{color:var(--p)}button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 5%;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.logo{font-size:1.4rem;font-weight:800;text-decoration:none;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}

@media(min-width:800px){nav a.l{display:inline-block}}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:1.15rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:12px;border:0;cursor:pointer;font-weight:600;background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;text-decoration:none;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.55;cursor:wait}.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.sm{padding:6px 12px;font-size:.9rem}
main{max-width:1150px;margin:auto;padding:0 5% 60px}section{padding:34px 0}
.hero{padding:56px 0 24px;text-align:center}.hero h1{font-size:clamp(2.1rem,7vw,3.8rem);font-weight:800;line-height:1.08;max-width:14ch;margin:0 auto 16px}
.hero p{max-width:56ch;margin:0 auto 24px;color:var(--mu)}
.search{max-width:560px;margin:auto;display:flex;gap:8px}.search input{flex:1}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
textarea{min-height:96px;resize:vertical}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:500}.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;cursor:pointer;box-shadow:var(--sh);transition:transform .2s,border-color .2s;text-align:left}.tc:hover{transform:translateY(-3px);border-color:var(--p)}
.tc .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;margin-bottom:10px}.tc h3{font-size:1.02rem}.tc p{margin:4px 0 0;color:var(--mu);font-size:.9rem}.tc small{color:var(--p);font-weight:600}

.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:var(--sh);margin-top:16px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
#out,.out{min-height:140px;white-space:pre-wrap;padding:14px;border:1px dashed var(--bd);border-radius:12px;background:var(--bg);overflow-wrap:anywhere}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.err{color:#d6284f;font-weight:600;margin-top:10px}.ok{color:var(--p3);font-weight:600}
.spin{width:18px;height:18px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite}@keyframes r{to{transform:rotate(1turn)}}
.msgs{height:50vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px}.m{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.m.user{align-self:flex-end;background:var(--p);color:#fff}.m.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--bd)}
.chat{display:grid;gap:14px}@media(min-width:800px){.chat{grid-template-columns:220px 1fr}}
.hl button{display:block;width:100%;text-align:left;padding:8px;border:0;background:none;border-radius:8px;cursor:pointer}.hl button.on{background:var(--bd)}
#ov{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}#ov.o{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);background:var(--card);z-index:50;transform:translateX(100%);transition:transform .28s;display:flex;flex-direction:column;padding:18px;box-shadow:-8px 0 30px #0004}#dr.o{transform:none}
#dr .who{padding:12px 0 14px;border-bottom:1px solid var(--bd);margin-bottom:8px;overflow-wrap:anywhere;font-weight:600}#dr a{padding:11px 8px;border-radius:10px;color:var(--tx);text-decoration:none;cursor:pointer}#dr a:hover{background:var(--bd)}
footer{border-top:1px solid var(--bd);padding:28px 5%;text-align:center;color:var(--mu)}footer a{margin:0 8px;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:90}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const SUPABASE_URL="YOUR_SUPABASE_PROJECT_URL",SUPABASE_PUBLISHABLE_KEY="YOUR_SUPABASE_PUBLISHABLE_KEY",WORKER_URL="YOUR_CLOUDFLARE_WORKER_URL";

const slug=n=>n.toLowerCase().replace(/&/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

const CAT={Writing:"#6d4aff",Creator:"#ff5c8a",Image:"#f59e0b",Career:"#0ea5e9",Business:"#12b9a6",Utility:"#8b5cf6",AI:"#ec4899",Education:"#22c55e",SEO:"#ef4444",Other:"#14b8a6"};
// [name,category,description,kind,fields "Label|type|options" (t text,a textarea,s select,n number,d date,p photo)]
const R=[
["AI Article Writer","Writing","Write full articles from a topic.","ai","Topic|t;Keywords|t;Tone|s|"+TN+";Length|s|Short (400 words)|Medium (800 words)|Long (1500 words);Language|s|"+L],
["Text Rewriter","Writing","Rewrite text in a new style.","ai","Text|a;Style|s|Simpler|More formal|More persuasive|Shorter|Friendlier;Language|s|"+L],
["Grammar Checker","Writing","Fix grammar and spelling.","ai","Text|a;Language|s|"+L],
["Email Writer","Writing","Draft clear emails fast.","ai","Purpose|t;Recipient|t;Tone|s|"+TN+";Key details|a;Language|s|"+L],
["Caption Generator","Creator","Captions for any post.","ai","Topic|a;Platform|s|"+PL+";Tone|s|"+TN+";Language|s|"+L],
["Hashtag Generator","Creator","Relevant hashtags by topic.","ai","Topic|t;Platform|s|"+PL+";Niche|t"],
["YouTube Title Maker","Creator","Click-worthy video titles.","ai","Video topic|a;Style|s|Curiosity|How-to|Listicle|Story|Review;Language|s|"+L],
["Description Maker","Creator","SEO video descriptions.","ai","Video topic|t;Key points|a;Keywords|t;Language|s|"+L],
["Image Prompt Maker","Creator","Prompts for AI image tools.","ai","Idea|a;Art style|s|Photorealistic|3D render|Anime|Watercolor|Cinematic|Flat illustration;Aspect ratio|s|1:1|16:9|9:16|4:3"],
["Facebook Post Generator","Creator","Engaging Facebook posts.","ai","Topic|a;Goal|s|Engagement|Sales|Announcement|Event;Tone|s|"+TN+";Language|s|"+L],
["Instagram Bio Generator","Creator","Bios that fit 150 characters.","ai","About you or brand|a;Tone|s|"+TN+";Language|s|"+L],
["YouTube Thumbnail Prompt Maker","Creator","Thumbnail prompts and text.","ai","Video topic|t;Mood|s|Exciting|Mysterious|Funny|Serious|Inspiring;Main subject|t"],
["Logo Prompt Generator","Creator","Prompts for logo design.","ai","Brand name|t;Industry|t;Style|s|Minimal|Playful|Luxury|Techy|Vintage;Colors|t"],
["AI Story Generator","Creator","Original short stories.","ai","Idea|a;Genre|s|Adventure|Fantasy|Mystery|Sci-fi|Romance|Kids;Characters|t;Length|s|Short|Medium|Long;Language|s|"+L],
["Script to Scene Planner","Creator","Turn scripts into scenes.","ai","Script|a;Format|s|YouTube video|Short film|Reel/Short|Ad"],
["YouTube Shorts Script Generator","Creator","Hook-to-CTA Shorts scripts.","ai","Topic|t;Niche|t;Audience|t;Language|s|"+L+";Duration|s|15 seconds|30 seconds|45 seconds|60 seconds;Style|s|Educational|Funny|Storytelling|Motivational|News;Call to action|t"],
["Image Resizer","Image","Resize and convert images in your browser.","img",""],
["AI CV Maker","Career","Build a CV and export a PDF.","cv","Full name|t;Email|t;Phone|t;Address|t;Professional title|t;Target job title|t;Education|a;Work experience|a;Skills|a;Languages|t;Certifications|a;Projects|a;Achievements|a;Additional information|a"],
["Cover Letter Maker","Career","Tailored cover letters as PDF.","cl","Full name|t;Email|t;Phone|t;Address|t;Company name|t;Job title|t;Job description|a;Education|a;Work experience|a;Skills|a;Additional information|a"],
["ATS Resume Checker","Career","Score a resume against a job.","ai","Resume text|a;Job description|a"],
["Interview Question Generator","Career","Practice questions for any role.","ai","Job title|t;Level|s|Entry|Mid|Senior;Focus|s|Mixed|Behavioral|Technical|Situational"],
["Job Application Email Writer","Career","Application emails that get read.","ai","Job title|t;Company|t;Your name|t;Your background|a;Tone|s|Professional|Friendly|Confident;Language|s|"+L],
["LinkedIn Profile Writer","Career","Headline and About section.","ai","Name|t;Current role|t;Target role|t;Experience facts|a;Skills|a;Tone|s|Professional|Friendly|Bold"],
["Job Interview Answer Coach","Career","Strong answers from your background.","ai","Job title|t;Industry|t;Experience level|s|Entry|Mid|Senior;Interview question|a;Your background|a;Language|s|"+L],
["Business Name Generator","Business","Brandable business names.","ai","Business idea|a;Industry|t;Style|s|Modern|Classic|Playful|Luxury|Short"],
["Product Description Maker","Business","Descriptions that sell.","ai","Product name|t;Features|a;Audience|t;Tone|s|"+TN+";Language|s|"+L],
["Ad Copy Generator","Business","Ads for any platform.","ai","Product or service|t;Audience|t;Platform|s|"+PL+"|Google Ads;Offer|t;Language|s|"+L],
["Business Plan Maker","Business","Full plan with labeled estimates.","ai","Business name|t;Idea|a;Location|t;Budget|t;Target customers|t;Business type|s|Product|Service|Online|Retail|Food|Other;Goals|a"],
["Word Counter","Utility","Count words, characters and reading time.","wc",""],
["Password Generator","Utility","Secure random passwords.","pw",""],
["Translator","Utility","Translate text between languages.","tr",""],
["Text to Speech","Utility","Read text aloud with your device voices.","tts",""],
["Age Calculator","Utility","Exact age and next birthday.","age",""],
["AI Chat Assistant","AI","Chat with an AI assistant.","chat",""],
["AI Study Notes Maker","Education","Notes from your material.","ai","Material|a;Subject|t;Detail|s|Brief|Detailed;Language|s|"+L],
["Quiz Generator","Education","Quizzes from any topic.","ai","Topic or text|a;Questions|n;Difficulty|s|Easy|Medium|Hard"],
["Flashcard Maker","Education","Q&A flashcards.","ai","Material|a;Cards|n"],
["SEO Keyword Generator","SEO","Keyword ideas with intent.","ai","Topic|t;Country|t;Language|s|"+L],
["Meta Title & Description Maker","SEO","Meta tags within limits.","ai","Page topic|t;Main keyword|t;Brand|t;Language|s|"+L],
["WhatsApp Message Writer","Other","Messages for any situation.","ai","Purpose|t;Recipient|t;Language|s|"+L+";Tone|s|"+TN+";Details|a"],
["Content Calendar Maker","Other","Plan a month of content.","ai","Business or niche|t;Platforms|t;Period|s|1 week|2 weeks|1 month;Goal|t;Language|s|"+L]
].map(r=>({name:r[0],cat:r[1],desc:r[2],kind:r[3],id:slug(r[0]),f:(r[4]||"").split(";").filter(Boolean).map(x=>{const p=x.split("|");return{l:p[0],t:p[1],o:p.slice(2)}})}));
const POP=["ai-article-writer","ai-cv-maker","ai-chat-assistant","youtube-shorts-script-generator","translator","cover-letter-maker","text-to-speech","image-prompt-maker"];
const ini=n=>n.split(" ").slice(0,2).map(w=>w[0]).join("");
const card=t=>`<button class="tc" onclick="go('/tool/${t.id}')"><div class="ic" style="background:${CAT[t.cat]}">${esc(ini(t.name))}</div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p><small>${t.cat}</small></button>`;
// ---- auth
let sb=null,user=null;
try{if(!SUPABASE_URL.startsWith("YOUR_")&&window.supabase)sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}})}catch(e){}
function upd(){$("#who").textContent=user?user.email:"Guest";$("#lo").style.display=user?"":"none";$("#lg").textContent=user?"Account":"Login / Account"}
if(sb){sb.auth.getSession().then(({data})=>{user=data.session?data.session.user:null;upd();route()});sb.auth.onAuthStateChange((_e,s)=>{user=s?s.user:null;upd();if(location.hash.startsWith("#/page/"))route()})}
$("#lo").onclick=async()=>{if(sb)await sb.auth.signOut();user=null;upd();closeDr();toast("Logged out");go("/")};
// ---- drawer/theme
const openDr=()=>{$("#dr").classList.add("o");$("#ov").classList.add("o");$("#dr").setAttribute("aria-hidden","false")},closeDr=()=>{$("#dr").classList.remove("o");$("#ov").classList.remove("o");$("#dr").setAttribute("aria-hidden","true")};
$("#hb").onclick=openDr;$("#cl").onclick=closeDr;$("#ov").onclick=closeDr;document.addEventListener("keydown",e=>e.key==="Escape"&&closeDr());
document.querySelectorAll("#dr a[data-g]").forEach(a=>a.onclick=()=>{closeDr();go(a.dataset.g)});
const setT=t=>{document.documentElement.dataset.t=t;try{localStorage.setItem("aimate_t",t)}catch(e){}};
setT((()=>{try{return localStorage.getItem("aimate_t")}catch(e){}})()||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("#th").onclick=()=>setT(document.documentElement.dataset.t==="dark"?"light":"dark");
// ---- api
async function api(path,body){
 if(WORKER_URL.startsWith("YOUR_"))throw new Error("WORKER_URL is not configured in index.html.");
 let r;try{r=await fetch(WORKER_URL.replace(/\/$/,"")+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}catch(e){throw new Error("Cannot reach the server. Check your connection and the Worker URL.")}
 let d={};try{d=await r.json()}catch(e){}
 if(!r.ok||d.error)throw new Error(d.error||"Request failed ("+r.status+").");return d.result}
// ---- routing
const go=p=>{location.hash="#"+p};window.go=go;
function route(){const h=location.hash.slice(1)||"/",a=$("#app");scrollTo(0,0);
 if(h==="/")return home(a);if(h==="/all")return home(a,true);
 if(h.startsWith("/tool/")){const t=R.find(x=>x.id===h.slice(6));return t?tool(a,t):home(a)}
 if(h.startsWith("/page/"))return page(a,h.slice(6));home(a)}
addEventListener("hashchange",route);
function home(a,onlyAll){
 a.innerHTML=`${onlyAll?"":`<div class="hero"><h1>Your AI Workspace, All in One Place</h1><p>AIMate brings 41 focused tools together: write, create, apply for jobs, plan a business, study and more. Pick a tool, fill in the form, get results.</p><div class="search"><input id="q" placeholder="Search 41 tools…" aria-label="Search tools"></div></div>
 <section><h2>Popular tools</h2><div class="grid" style="margin-top:14px">${POP.map(i=>card(R.find(t=>t.id===i))).join("")}</div></section>`}
 <section id="all"><h2>All tools</h2>${onlyAll?`<div class="search" style="margin:14px 0"><input id="q" placeholder="Search tools…"></div>`:""}<div class="chips" id="cats"></div><div class="grid" id="tg"></div><p id="none" class="out" style="display:none">No tools match. Try another word or category.</p></section>
 ${onlyAll?"":`<section><h2>Why AIMate</h2><div class="feat" style="margin-top:14px"><div><b>One tool, one purpose</b><br>Every tool has its own form and options.</div><div><b>Private by design</b><br>Utilities like Word Counter, Password Generator and Image Resizer run in your browser.</div><div><b>Works everywhere</b><br>Responsive on Android and desktop, light and dark.</div><div><b>Honest AI</b><br>Career tools never invent your experience.</div></div></section>
 <section><h2>About AIMate</h2><p style="max-width:70ch;color:var(--mu)">AIMate is a workspace of 41 AI-assisted and everyday tools for writers, creators, job seekers, students and small businesses. <a href="#/page/about">Read more</a>.</p></section>`}`;
 let cat="All",q="";const cs=["All",...Object.keys(CAT)];
 const draw=()=>{$("#cats").innerHTML=cs.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
  const l=R.filter(t=>(cat==="All"||t.cat===cat)&&(t.name+t.desc+t.cat).toLowerCase().includes(q));$("#tg").innerHTML=l.map(card).join("");$("#none").style.display=l.length?"none":"block";
  document.querySelectorAll("#cats .chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw()})};
 $("#q").oninput=e=>{q=e.target.value.toLowerCase().trim();draw();if(q&&!onlyAll)$("#all").scrollIntoView()};draw()}
// ---- tool pages
function head(t){return `<section><button class="btn s sm" onclick="history.length>1?history.back():go('/')">← Back</button><h1 style="margin-top:14px;font-size:clamp(1.6rem,5vw,2.4rem)">${esc(t.name)}</h1><p style="color:var(--mu)">${esc(t.desc)}</p>`}
function form(t){return t.f.map((f,i)=>{const n=`f${i}`,L=`<label for="${n}">${esc(f.l)}</label>`;
 if(f.t==="a")return L+`<textarea id="${n}"></textarea>`;if(f.t==="s")return L+`<select id="${n}">${f.o.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;
 if(f.t==="n")return L+`<input id="${n}" type="number" min="1" max="30" value="5">`;
 return L+`<input id="${n}" type="text">`}).join("")}
const getF=t=>{const o={};t.f.forEach((f,i)=>o[f.l]=$("#f"+i).value.trim());return o};
function outBar(extra=""){return `<div class="bar"><button class="btn s sm" id="cp">Copy</button><button class="btn s sm" id="dl">Download .txt</button>${extra}<button class="btn s sm" id="cx">Clear</button></div>`}
function wireOut(name){const o=()=>$("#out");
 $("#cp").onclick=async()=>{const t=o().innerText.trim();if(!t)return toast("Nothing to copy");try{await navigator.clipboard.writeText(t);toast("Copied")}catch(e){toast("Copy blocked by browser")}};
 $("#dl").onclick=()=>{const t=o().innerText.trim();if(!t)return toast("Nothing to download");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download=slug(name)+".txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 $("#cx").onclick=()=>{o().textContent="";$("#er").textContent=""}}
function pdf(text,title,photo,sub){
 if(!window.jspdf)return toast("PDF library failed to load. Check your connection.");
 const d=new window.jspdf.jsPDF({unit:"pt",format:"a4"}),W=d.internal.pageSize.getWidth(),m=48;let y=m;
